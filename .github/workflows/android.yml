# Android 客户端打包（app/，Flutter）
#
# 触发方式：
#   - 手动：Actions 页面 → Android → Run workflow
#   - 自动：app/ 有改动推送到 main 时
#   - PR：只跑检查和测试，不发布
#   - 发版：release.yml 推送 v* tag 时调用本流程，APK 放进正式 Release
#
# 产物：
#   - 本次运行的 Artifacts（zip，需要登录 GitHub 下载）
#   - 手动运行 / 推送到 main 时，同时更新「Android 测试版」预发布：
#     https://github.com/<仓库>/releases/tag/android-nightly —— 手机浏览器打开直接下载 APK
#
# 签名：仓库 Secrets 里配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#       （一键配置：bash app/tool/setup-signing.sh）。没配置时用临时 debug 签名，能装，但和家人手机上的版本签名不同，不能覆盖升级。
name: Android

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '发布到「Android 测试版」预发布页（手机上可以直接下载）'
        type: boolean
        default: true
      tests:
        description: '打包前跑 flutter analyze + flutter test'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'
  workflow_call:
    inputs:
      version:
        description: '正式版本号（由 release.yml 传入）'
        type: string
        required: true
      tests:
        type: boolean
        default: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.2

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    # 不放在 workflow 顶层：被 release.yml 调用时，顶层 concurrency 会和调用方的分组冲突
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }} # 同一分支连续推送只打最新的；正式发版不取消
    outputs:
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Test
        if: inputs.tests != false
        run: |
          flutter analyze
          flutter test

      # 版本号来源：app/pubspec.yaml 的 version: 1.2.3+10203（scripts/release.sh 会自动维护）
      # 正式版：versionName = 1.2.3；测试版：1.2.3-dev.<运行序号>，versionCode 不变（不会触发家人手机上的自更新提示）
      - name: Version
        id: ver
        shell: bash
        run: |
          LINE=$(grep -E '^version:' pubspec.yaml)
          BASE=$(sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/' <<<"$LINE")
          CODE=$(sed -E 's/.*\+([0-9]+).*/\1/' <<<"$LINE")
          if [[ -n "${{ inputs.version }}" ]]; then
            [[ "${{ inputs.version }}" == "$BASE" ]] || { echo "::error::app/pubspec.yaml 的版本 $BASE 和发布版本 ${{ inputs.version }} 不一致，用 scripts/release.sh 发版会自动同步"; exit 1; }
            NAME="$BASE"
          else
            NAME="$BASE-dev.${{ github.run_number }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "版本：$NAME（versionCode $CODE）"

      - name: Signing
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/nuan-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/nuan-release.jks"
              echo "storePassword=$STORE_PW"
              echo "keyAlias=${KEY_ALIAS:-nuan}"
              echo "keyPassword=${KEY_PW:-$STORE_PW}"
            } > android/key.properties
            echo "SIGNING=正式签名" >> "$GITHUB_ENV"
          else
            echo "::warning::没有配置签名 Secrets，APK 使用临时 debug 签名，不能覆盖升级家人手机上的版本。运行 bash app/tool/setup-signing.sh 一键配置"
            echo "SIGNING=临时 debug 签名" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: flutter build apk --release --split-per-abi --build-name="${{ steps.ver.outputs.name }}"

      - name: Collect
        shell: bash
        run: |
          NAME="${{ steps.ver.outputs.name }}"
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "$OUT/XiaoNuan_${NAME}_Android_arm64.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$OUT/XiaoNuan_${NAME}_Android_armv7.apk"
          rm -f android/key.properties
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs "$OUT/XiaoNuan_${NAME}_Android_arm64.apk" 2>/dev/null | grep -m1 'SHA-256' | sed 's/.*: //' || true)
          {
            echo "## Android ${NAME}"
            echo
            echo "| 文件 | 大小 | 适用 |"
            echo "|---|---|---|"
            echo "| \`XiaoNuan_${NAME}_Android_arm64.apk\` | $(du -h "$OUT/XiaoNuan_${NAME}_Android_arm64.apk" | cut -f1) | 绝大多数手机 |"
            echo "| \`XiaoNuan_${NAME}_Android_armv7.apk\` | $(du -h "$OUT/XiaoNuan_${NAME}_Android_armv7.apk" | cut -f1) | 旧款 32 位手机 |"
            echo
            echo "签名：${SIGNING}${CERT:+（证书 SHA-256 \`${CERT:0:23}…\`）}"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: out/*
          if-no-files-found: error

  # 滚动更新的「Android 测试版」预发布：每次覆盖，只保留最新一份
  nightly:
    name: Publish nightly
    needs: build
    # github.workflow 在被 release.yml 调用时是调用方的名字，这样正式发版时不会走到这里
    if: github.workflow == 'Android' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || github.event_name == 'push')
    runs-on: ubuntu-latest
    concurrency:
      group: android-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-android
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          (cd out && sha256sum * > SHA256SUMS.txt)
          cat > notes.md <<EOF
          **小暖 Android 测试版 ${NAME}** · 提交 \`${GITHUB_SHA::7}\` · $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')

          手机浏览器打开本页，下载 \`XiaoNuan_${NAME}_Android_arm64.apk\` 安装即可（旧款 32 位手机用 armv7）。安装时允许「安装未知来源应用」。

          这是开发中的测试版，每次打包都会覆盖；正式版本见 [Releases](https://github.com/${GH_REPO}/releases/latest)。
          EOF
          gh release delete android-nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create android-nightly out/* --prerelease --target "$GITHUB_SHA" --title "小暖 Android 测试版 ${NAME}" --notes-file notes.md
          echo "### 手机下载：https://github.com/${GH_REPO}/releases/tag/android-nightly" >> "$GITHUB_STEP_SUMMARY"
