# 小暖 (Nuan) Nginx 反向代理示例配置
# 放置于 /etc/nginx/conf.d/nuan.conf 或 /etc/nginx/sites-available/nuan

upstream nuan_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.example.com;

    # TLS 证书（以 Let's Encrypt / Certbot 为例）
    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 图片上传上限 20MB，录音上传上限 10MB，此处留足余量设为 25MB
    client_max_body_size 25m;

    # 通用代理头
    # 注意：服务端按 X-Forwarded-For 首个 IP 做登录防爆破限流。
    # 若本 Nginx 直接面向公网，请用 $remote_addr 覆盖，防止客户端伪造请求头绕过 IP 限流；
    # 若前方还有可信 CDN/网关，再按需改为 $proxy_add_x_forwarded_for。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE 流式接口：必须关闭缓冲与压缩、使用 HTTP/1.1 并放宽读超时
    location ~ ^/api/messages/[^/]+/stream$ {
        proxy_pass http://nuan_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;

        # 服务端每 15 秒发送一次 ": ping\n\n" 心跳，长超时保证深度思考阶段不断连
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余 API、/healthz 与 /app/download/* APK 下载接口
    location / {
        proxy_pass http://nuan_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 语音识别接口上游超时为 60s，此处设为 120s 避免网关提前断开
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
